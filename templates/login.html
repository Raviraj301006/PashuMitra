
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PashuMitra - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 15px;
            background: #183D30;
            font-family: Arial, Helvetica, sans-serif;
            color: #183D30;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            background: #DCE7D5;
            border: 1px solid #c4d4bd;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
        }

        .brand-panel {
            background: #DCE7D5;
            padding: 35px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            display: block;
            mix-blend-mode: multiply;
        }

        .brand-name {
            margin: 14px 0 6px;
            color: #183D30;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 29px;
        }

        .brand-tagline {
            margin: 0;
            color: #506B56;
            font-size: 13px;
            line-height: 1.7;
        }

        .brand-line {
            width: 42px;
            height: 3px;
            border-radius: 5px;
            background: #245B3D;
            margin-top: 20px;
        }

        .form-panel {
            padding: 45px 42px;
            background: #DCE7D5;
        }

        .form-panel h2 {
            margin: 0 0 10px;
            color: #183D30;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #506652;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #183D30;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            display: block;
            width: 100%;
            height: 47px;
            padding: 0 14px;
            border: 1px solid #c4d4bd;
            border-radius: 8px;
            background: #F4EBD8;
            color: #183D30;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #7c8172;
        }

        input:focus {
            border-color: #245B3D;
            box-shadow: 0 0 0 3px rgba(36, 91, 61, 0.15);
        }

        .login-button {
            width: 100%;
            height: 48px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #245B3D;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .login-button:hover {
            background: #183D30;
            transform: translateY(-1px);
        }

        .register-link {
            margin: 24px 0 0;
            color: #506652;
            font-size: 13px;
            text-align: center;
        }

        .register-link a {
            margin-left: 4px;
            color: #183D30;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            body {
                align-items: flex-start;
                padding: 15px 10px;
            }

            .login-card {
                max-width: 430px;
                grid-template-columns: 1fr;
            }

            .brand-panel {
                padding: 20px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .brand-name {
                margin-top: 8px;
                font-size: 24px;
            }

            .brand-line {
                margin-top: 10px;
            }

            .form-panel {
                padding: 28px 23px;
            }

            .form-panel h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">

        <section class="brand-panel">
            <img
                class="logo"
                src="{{ url_for('static', filename='pashumitra_logo.png') }}"
                alt="PashuMitra logo"
            >

            <h1 class="brand-name">PashuMitra</h1>

            <p class="brand-tagline">
                Your Digital Livestock Manager
            </p>

            <div class="brand-line"></div>
        </section>

        <section class="form-panel">
            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to continue managing your livestock.
            </p>

            <form method="POST">

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        inputmode="numeric"
                        placeholder="Enter mobile number"
                        autocomplete="tel-national"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="login-button" type="submit">
                    Login
                </button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create Account</a>
            </p>
        </section>

    </main>
</body>
</html>
