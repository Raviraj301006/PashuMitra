
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PashuMitra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #183D30;
            font-family: Georgia, "Times New Roman", serif;
            color: #DCE7D5;
        }

        .splash {
            width: 100%;
            max-width: 500px;
            padding: 35px 24px;
            text-align: center;
            animation: appear 1.2s ease both;
        }

        .logo {
            width: min(72vw, 280px);
            height: auto;
            display: block;
            margin: 0 auto 22px;
            mix-blend-mode: screen;
            animation: logo-arrive 1.5s ease both;
        }

        .brand-name {
            margin: 0 0 12px;
            color: #DCE7D5;
            font-size: 36px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .tagline {
            margin: 0;
            color: #F4EBD8;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.7;
            opacity: 0;
            animation: tagline-arrive 0.8s ease 0.8s forwards;
        }

        .loading {
            width: 100px;
            height: 4px;
            margin: 32px auto 0;
            background: #506652;
            overflow: hidden;
            border-radius: 5px;
        }

        .loading span {
            display: block;
            width: 40%;
            height: 100%;
            background: #F4EBD8;
            border-radius: 5px;
            animation: loading 1.2s ease-in-out infinite;
        }

        .skip {
            margin-top: 28px;
            padding: 12px 24px;
            background: #DCE7D5;
            border: 1px solid #DCE7D5;
            border-radius: 25px;
            color: #183D30;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        .skip:hover {
            background: #F4EBD8;
            transform: translateY(-2px);
        }

        @keyframes appear {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes logo-arrive {
            from {
                opacity: 0;
                transform: scale(0.88) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes tagline-arrive {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            from {
                transform: translateX(-110%);
            }
            to {
                transform: translateX(260%);
            }
        }

        @media (max-width: 500px) {
            .brand-name {
                font-size: 30px;
            }

            .logo {
                width: min(70vw, 230px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <main class="splash">

        <img
            class="logo"
            src="{{ url_for('static', filename='pashumitra_logo.png') }}"
            alt="PashuMitra logo"
        >

        <h1 class="brand-name">PashuMitra</h1>

        <p class="tagline">
            Your Digital Livestock Manager
        </p>

        <div class="loading" aria-label="Loading">
            <span></span>
        </div>

        <button class="skip" onclick="openLogin()">
            Continue to Login →
        </button>

    </main>

    <script>
        function openLogin() {
            window.location.href = "{{ url_for('login') }}";
        }

        window.setTimeout(openLogin, 3500);
    </script>

</body>
</html>
